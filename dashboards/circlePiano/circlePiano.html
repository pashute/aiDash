<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Piano demonstrated v1.0</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d0d0f;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; font-family:'Georgia',serif; color:#e8d5a3; overflow:hidden;
}
#app {
  position:relative; width:100vmin; height:100vmin;
  max-width:620px; max-height:620px;
}
#top-left {
  position:absolute; top:14px; left:14px;
  display:flex; gap:8px; z-index:20;
}
#top-right { position:absolute; top:14px; right:14px; z-index:20; }

.ctrl-btn {
  background:rgba(30,25,20,0.9); border:1px solid #5a4a2a; border-radius:6px;
  color:#c8a96e; width:36px; height:36px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; transition:all 0.2s; user-select:none;
}
.ctrl-btn:hover { border-color:#c8a96e; background:rgba(50,40,25,0.95); }
.ctrl-btn.inactive { opacity:0.3; cursor:default; pointer-events:none; }
.ctrl-btn.active-on { color:#7fff7f; border-color:#7fff7f; box-shadow:0 0 8px #7fff7f55; }

#piano-svg { width:100%; height:100%; position:absolute; top:0; left:0; }

/* Center overlay */
#center-overlay {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:36%; height:36%;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:10;
}
#chord-label {
  position:absolute; left:-8px; transform:translateX(-100%);
  background:rgba(18,14,10,0.92); border:1px solid #3a2e1a;
  padding:4px 9px; border-radius:5px;
  font-size:13px; font-weight:bold; color:#f0e0b0;
  white-space:nowrap; pointer-events:auto; cursor:pointer;
  min-width:52px; text-align:center;
}
#chord-input {
  display:none; position:absolute; left:-8px; transform:translateX(-100%);
  background:rgba(18,14,10,0.97); border:1px solid #c8a96e;
  padding:4px 9px; border-radius:5px;
  font-size:13px; font-weight:bold; color:#f0e0b0; width:74px;
}
#chord-toggle {
  width:52px; height:52px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #2a1f2e, #0e0c0a);
  border:2.5px solid #6a1f3a; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  pointer-events:auto; transition:border-color 0.3s, box-shadow 0.3s;
  z-index:11; position:relative; box-shadow:0 0 10px #6a1f3a66;
}
#chord-toggle.on { border-color:#1f9a4a; box-shadow:0 0 14px #1f9a4a99; }
#chord-buttons {
  position:absolute; right:-8px; transform:translateX(100%);
  display:flex; flex-direction:column; gap:4px; pointer-events:auto;
}
.chord-type-btn {
  border:none; border-radius:4px; padding:3px 8px;
  font-size:11px; font-weight:bold; cursor:pointer;
  width:58px; text-align:center; transition:outline 0.15s;
  outline:2px solid transparent;
}
.chord-type-btn.selected { outline:2.5px solid #fff; }
#btn-minor   { background:#6b1a1a; color:#f0c0c0; }
#btn-seventh { background:#c8960a; color:#1a1000; }
#btn-major   { background:#4fa31a; color:#0a1800; }

/* Settings */
#settings-page {
  display:none; position:absolute; inset:0;
  background:#0d0d0f; z-index:50; padding:18px; overflow-y:auto;
}
#settings-page.visible { display:block; }
#settings-page h2 {
  color:#c8a96e; font-size:17px; margin-bottom:14px;
  border-bottom:1px solid #3a2e1a; padding-bottom:8px;
  display:flex; justify-content:space-between; align-items:center;
}
#close-settings {
  background:none; border:1px solid #5a4a2a; color:#c8a96e;
  border-radius:5px; padding:2px 10px; cursor:pointer; font-size:13px;
}
.settings-section {
  margin-bottom:14px; background:rgba(255,255,255,0.03);
  border:1px solid #2a2018; border-radius:6px; padding:10px 13px;
}
.settings-section h3 {
  color:#c8a96e; font-size:12px; margin-bottom:9px;
  text-transform:uppercase; letter-spacing:0.08em;
}
.midi-dot {
  display:inline-block; width:10px; height:10px; border-radius:50%;
  margin-right:6px; background:#f0c030; box-shadow:0 0 6px #f0c030; vertical-align:middle;
}
.settings-row {
  display:flex; align-items:center; gap:10px;
  margin-bottom:7px; font-size:13px; color:#c8c0a8;
}
.settings-row label { min-width:95px; }
.settings-row input[type=range] { flex:1; accent-color:#c8a96e; }
.settings-row select, .settings-row input[type=number] {
  background:#1a160e; border:1px solid #3a2e1a; color:#e8d5a3;
  border-radius:4px; padding:2px 6px; font-size:12px;
}
.radio-row { display:flex; gap:12px; flex-wrap:wrap; }
.radio-row label { display:flex; align-items:center; gap:4px; font-size:12px; color:#c8c0a8; cursor:pointer; min-width:unset; }
#scale-keyboard { display:flex; position:relative; height:50px; width:100%; margin-top:7px; }
.sk-white {
  flex:1; background:#e8dfc8; border:1px solid #3a3028;
  border-radius:0 0 3px 3px; cursor:pointer; height:100%;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:3px; font-size:9px; color:#3a2e1a; font-weight:bold; transition:background 0.2s;
}
.sk-white.scale-active { background:#8855cc; color:#fff; }
.sk-white:hover { background:#c8bfa8; }
.sk-white.scale-active:hover { background:#9966dd; }
.sk-blacks { position:absolute; top:0; left:0; width:100%; height:62%; pointer-events:none; }
.sk-black {
  position:absolute; background:#1a120a; border-radius:0 0 3px 3px;
  cursor:pointer; pointer-events:auto; height:100%; width:7%;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:2px; font-size:7px; color:#e8d5a3; transition:background 0.2s;
}
.sk-black.scale-active { background:#8855cc; }
</style>
</head>
<body>
<div id="app">

  <div id="top-left">
    <button class="ctrl-btn" id="btn-metro" title="Metronome toggle">
      <!-- metronome SVG -->
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="10,2 17,18 3,18" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <line x1="10" y1="18" x2="10" y2="8" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <line id="metro-arm" x1="10" y1="15" x2="14" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="10" cy="18" r="1.2" fill="currentColor"/>
      </svg>
    </button>
    <button class="ctrl-btn inactive" id="btn-rec"   title="Record (future)">⏺</button>
    <button class="ctrl-btn inactive" id="btn-pause" title="Pause (future)">⏸</button>
    <button class="ctrl-btn inactive" id="btn-stop"  title="Stop (future)">⏹</button>
  </div>

  <div id="top-right">
    <button class="ctrl-btn" id="btn-settings" title="Settings">⚙</button>
  </div>

  <svg id="piano-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1c1710"/>
        <stop offset="100%" stop-color="#080606"/>
      </radialGradient>
      <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

    </defs>
    <!-- Outer gold rim -->
    <circle cx="300" cy="300" r="295" fill="url(#bg-grad)" stroke="#c8a96e" stroke-width="2.5"/>
    <g id="white-keys"></g>
    <g id="black-keys"></g>
    <!-- Clock face -->
    <circle cx="300" cy="300" r="112" fill="#0c0a08" stroke="#2a2018" stroke-width="1.5"/>
    <g id="hour-digits"></g>
    <!-- hand-1: root / current note — gold, thick -->
    <line id="hand-1" x1="300" y1="300" x2="300" y2="232" stroke="#c8a96e" stroke-width="3.5" stroke-linecap="round"/>
    <!-- hand-2: third / previous note — blue, medium -->
    <line id="hand-2" x1="300" y1="300" x2="300" y2="216" stroke="#6888d0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- hand-3: fifth — red, thin -->
    <line id="hand-3" x1="300" y1="300" x2="300" y2="206" stroke="#c84040" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="300" cy="300" r="4.5" fill="#c8a96e"/>
  </svg>

  <!-- Center overlay: chord label | toggle | chord buttons -->
  <div id="center-overlay">
    <span id="chord-label">C Maj</span>
    <input id="chord-input" type="text" value="C Maj"/>

    <!-- Toggle button with guitar SVG -->
    <button id="chord-toggle" title="Toggle chord mode">
      <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <!-- Guitar body -->
        <ellipse cx="14" cy="19" rx="7" ry="6" fill="none" stroke="#c8704a" stroke-width="1.6"/>
        <!-- Waist -->
        <path d="M10,17 Q14,14 18,17" fill="none" stroke="#c8704a" stroke-width="1.3"/>
        <!-- Neck -->
        <rect x="13" y="5" width="2" height="9" rx="1" fill="#c8a96e"/>
        <!-- Headstock -->
        <rect x="11.5" y="3" width="5" height="3" rx="1" fill="#8a6030"/>
        <!-- Strings (3 lines) -->
        <line x1="12" y1="13" x2="12" y2="20" stroke="#e0d0a0" stroke-width="0.6" opacity="0.8"/>
        <line x1="14" y1="13" x2="14" y2="21" stroke="#e0d0a0" stroke-width="0.6" opacity="0.8"/>
        <line x1="16" y1="13" x2="16" y2="20" stroke="#e0d0a0" stroke-width="0.6" opacity="0.8"/>
        <!-- Sound hole -->
        <circle cx="14" cy="19" r="2" fill="none" stroke="#c8704a" stroke-width="0.8" opacity="0.6"/>
      </svg>
    </button>

    <div id="chord-buttons">
      <button class="chord-type-btn" id="btn-minor">− minor</button>
      <button class="chord-type-btn" id="btn-seventh">7 seventh</button>
      <button class="chord-type-btn selected" id="btn-major">+ major</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings-page">
    <h2>Settings <button id="close-settings">✕ Close</button></h2>

    <div class="settings-section">
      <h3>MIDI</h3>
      <div class="settings-row">
        <span class="midi-dot" id="midi-dot"></span>
        <span id="midi-status">Not checked yet</span>
      </div>
      <div class="settings-row"><label>Channel</label><span>1</span></div>
    </div>

    <div class="settings-section">
      <h3>Instrument</h3>
      <div class="settings-row">
        <div class="radio-row" id="instrument-radios">
          <label><input type="radio" name="instrument" value="piano" checked> Piano</label>
          <label><input type="radio" name="instrument" value="sax"> Sax</label>
          <label><input type="radio" name="instrument" value="guitar"> Guitar</label>
        </div>
      </div>
      <div class="settings-row">
        <label>Strum speed</label>
        <input type="range" min="0" max="4" value="2" id="strum-speed">
        <span id="strum-val">2</span>
      </div>
      <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:5px;">
        <label>Strum pattern</label>
        <div class="radio-row" style="flex-direction:column;gap:4px;">
          <label><input type="radio" name="strum" value="single" checked> d---. (single)</label>
          <label><input type="radio" name="strum" value="p1"> d-du,udu-</label>
          <label><input type="radio" name="strum" value="p2"> d-d-,dudu</label>
          <label><input type="radio" name="strum" value="custom"> custom:
            <input type="text" style="width:80px;margin-left:4px;background:#1a160e;border:1px solid #3a2e1a;color:#e8d5a3;border-radius:3px;padding:1px 4px;font-size:11px;" placeholder="d-du..."/>
          </label>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Metronome</h3>
      <div class="settings-row">
        <label>Sound</label>
        <div class="radio-row">
          <label><input type="radio" name="metro-sound" value="tick" checked> tick</label>
          <label><input type="radio" name="metro-sound" value="drum"> drum</label>
          <label><input type="radio" name="metro-sound" value="beep"> beep</label>
        </div>
      </div>
      <div class="settings-row">
        <label>BPM</label>
        <input type="number" id="metro-bpm" value="110" min="20" max="300" style="width:62px;">
      </div>
    </div>

    <div class="settings-section">
      <h3>Scale</h3>
      <div class="settings-row">
        <label>Scale type</label>
        <select id="scale-type">
          <option value="major">Major</option>
          <option value="minor">Minor</option>
          <option value="romanian">Romanian</option>
        </select>
      </div>
      <div class="settings-row" style="flex-direction:column;align-items:flex-start;">
        <label style="margin-bottom:6px;">Scale key</label>
        <div id="scale-keyboard">
          <div class="sk-white scale-active" data-note="C">C</div>
          <div class="sk-white" data-note="D">D</div>
          <div class="sk-white" data-note="E">E</div>
          <div class="sk-white" data-note="F">F</div>
          <div class="sk-white" data-note="G">G</div>
          <div class="sk-white" data-note="A">A</div>
          <div class="sk-white" data-note="B">B</div>
          <div class="sk-blacks">
            <div class="sk-black" data-note="C#" style="left:10%">C#</div>
            <div class="sk-black" data-note="D#" style="left:22.5%">D#</div>
            <div class="sk-black" data-note="F#" style="left:47.5%">F#</div>
            <div class="sk-black" data-note="G#" style="left:60%">G#</div>
            <div class="sk-black" data-note="A#" style="left:72.5%">A#</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
// ── DATA ──────────────────────────────────────────────────────
// White keys in order starting at D (12 o'clock)
const WHITE_NOTES = ['D','E','F','G','A','B','C'];
// Black key that follows each white key (clockwise), null = no black
const BLACK_AFTER  = {'D':'D#','E':null,'F':'F#','G':'G#','A':'A#','B':null,'C':'C#'};

const ALL_CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALE_INTERVALS = {
  major:    [0,2,4,5,7,9,11],
  minor:    [0,2,3,5,7,8,10],
  romanian: [0,2,3,6,7,9,10]
};

// ── STATE ─────────────────────────────────────────────────────
let chordMode  = false;
let chordType  = 'major';
let scaleKey   = 'C';
let scaleType  = 'major';
let instrument = 'piano';
let activeNote = null;
let prevNote   = null;
let metroOn    = false;
let metroTimer = null;
let audioCtx   = null;
let midiOutput = null;
let activeOscs = [];

// ── HELPERS ───────────────────────────────────────────────────
const CX = 300, CY = 300;
const OUTER_R = 287, INNER_R = 118;
const BLACK_INNER = INNER_R + 18;  // black keys stop just outside the clock face
const WHITE_DEG = 360 / 7; // each white key spans this many degrees

function getScaleNotes(key, type) {
  const root = ALL_CHROMATIC.indexOf(key);
  return SCALE_INTERVALS[type].map(i => ALL_CHROMATIC[(root+i)%12]);
}

// Angle for the CENTER of white key at index i  (D=0 → 12 o'clock = -90°)
function whiteKeyCenter(i) { return -90 + i * WHITE_DEG; }

function deg2rad(d) { return d * Math.PI / 180; }
function polar(cx,cy,r,deg) {
  const a = deg2rad(deg);
  return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
}

function arcPath(cx,cy,r1,r2,startDeg,endDeg) {
  const [ax,ay] = polar(cx,cy,r1,startDeg);
  const [bx,by] = polar(cx,cy,r1,endDeg);
  const [cx2,cy2] = polar(cx,cy,r2,endDeg);
  const [dx2,dy2] = polar(cx,cy,r2,startDeg);
  const lg = (endDeg - startDeg) > 180 ? 1 : 0;
  return `M${ax},${ay} A${r1},${r1},0,${lg},1,${bx},${by} L${cx2},${cy2} A${r2},${r2},0,${lg},0,${dx2},${dy2} Z`;
}

// ── DRAW PIANO ───────────────────────────────────────────────
function drawPiano() {
  const wg = document.getElementById('white-keys');
  const bg = document.getElementById('black-keys');
  wg.innerHTML = ''; bg.innerHTML = '';

  const scaleNotes = getScaleNotes(scaleKey, scaleType);

  WHITE_NOTES.forEach((note, i) => {
    const center  = whiteKeyCenter(i);
    const half    = WHITE_DEG / 2;
    const gap     = 0.6; // tiny gap between keys
    const wStart  = center - half + gap;
    const wEnd    = center + half - gap;

    // Coloring: in-scale=ivory, out-of-scale=very dark, active=purple
    const inScale = scaleNotes.includes(note);
    let fill = inScale ? '#e8dfc8' : '#1c1710';
    if (activeNote === note) fill = '#8844cc';

    // White key wedge (full, background)
    const p = mkPath(arcPath(CX,CY,OUTER_R,INNER_R,wStart,wEnd), fill, '#2e2418', '1');
    p.setAttribute('class','piano-key white-key');
    p.dataset.note = note;
    if (activeNote === note) p.setAttribute('filter','url(#glow-purple)');
    p.style.cursor = 'pointer';
    wg.appendChild(p);

    // Outer half zone (higher octave) — invisible hit area
    const midR = (OUTER_R + INNER_R) / 2;
    const outerHalf = mkPath(arcPath(CX,CY,OUTER_R,midR,wStart,wEnd), 'transparent', 'none', '0');
    outerHalf.setAttribute('class','piano-key-outer key-half');
    outerHalf.dataset.note = note;
    outerHalf.dataset.octave = 'upper';
    outerHalf.dataset.baseNote = note;
    outerHalf.style.cursor = 'pointer';
    wg.appendChild(outerHalf);

    // Inner half zone (lower octave) — invisible hit area
    const innerHalf = mkPath(arcPath(CX,CY,midR,INNER_R,wStart,wEnd), 'transparent', 'none', '0');
    innerHalf.setAttribute('class','piano-key-inner key-half');
    innerHalf.dataset.note = note;
    innerHalf.dataset.octave = 'lower';
    innerHalf.dataset.baseNote = note;
    innerHalf.style.cursor = 'pointer';
    wg.appendChild(innerHalf);

    // Note letter — placed near outer rim, centered on key
    const [lx,ly] = polar(CX,CY,OUTER_R - 20, center);
    const txt = mkText(note, lx, ly, 16, activeNote===note ? '#ddc0ff' : '#2a1808');
    txt.setAttribute('class','key-label');
    txt.dataset.note = note;
    txt.style.cursor = 'pointer';
    // Rotate text to be radially oriented (pointing outward)
    txt.setAttribute('transform', `rotate(${center+90}, ${lx}, ${ly})`);
    wg.appendChild(txt);

    // Black key between this note and next white key
    const blackNote = BLACK_AFTER[note];
    if (blackNote) {
      // Black key spans the seam area between this white key and next
      const bCenter = center + half; // right edge of this white key = seam
      const bHalf   = WHITE_DEG * 0.22;
      const bStart  = bCenter - bHalf;
      const bEnd    = bCenter + bHalf;

      const bInScale = scaleNotes.includes(blackNote);
      let bFill = bInScale ? '#c8b890' : '#100d08';
      if (activeNote === blackNote) bFill = '#8844cc';

      const bp = mkPath(arcPath(CX,CY,OUTER_R,BLACK_INNER,bStart,bEnd), bFill, '#060402', '1');
      bp.setAttribute('class','piano-key black-key');
      bp.dataset.note = blackNote;
      if (activeNote === blackNote) bp.setAttribute('filter','url(#glow-purple)');
      bp.style.cursor = 'pointer';
      bg.appendChild(bp);

      // Black key octave half zones — same midR as white keys
      const bMidR = (OUTER_R + INNER_R) / 2;
      const bOuterH = mkPath(arcPath(CX,CY,OUTER_R,bMidR,bStart,bEnd), 'transparent', 'none', '0');
      bOuterH.setAttribute('class','piano-key-outer key-half black-half');
      bOuterH.dataset.note = blackNote; bOuterH.dataset.octave = 'upper';
      bOuterH.style.cursor = 'pointer';
      bg.appendChild(bOuterH);

      const bInnerH = mkPath(arcPath(CX,CY,bMidR,BLACK_INNER,bStart,bEnd), 'transparent', 'none', '0');
      bInnerH.setAttribute('class','piano-key-inner key-half black-half');
      bInnerH.dataset.note = blackNote; bInnerH.dataset.octave = 'lower';
      bInnerH.style.cursor = 'pointer';
      bg.appendChild(bInnerH);

      // Black key label (tiny, near outer rim)
      const [blx,bly] = polar(CX,CY,OUTER_R-11, bCenter);
      const btxt = mkText(blackNote, blx, bly, 7, '#b89050');
      btxt.setAttribute('class','key-label');
      btxt.dataset.note = blackNote;
      btxt.style.cursor = 'pointer';
      btxt.setAttribute('transform', `rotate(${bCenter+90}, ${blx}, ${bly})`);
      bg.appendChild(btxt);
    }
  });

  addKeyListeners();

  // Octave divider ring — thin circle at the midpoint of white keys
  const midR = (OUTER_R + INNER_R) / 2;
  const divider = document.createElementNS('http://www.w3.org/2000/svg','circle');
  divider.setAttribute('cx', CX); divider.setAttribute('cy', CY);
  divider.setAttribute('r', midR);
  divider.setAttribute('fill','none');
  divider.setAttribute('stroke','#8860a8');
  divider.setAttribute('stroke-width','1.2');
  divider.setAttribute('stroke-dasharray','4,3');
  divider.setAttribute('opacity','0.55');
  divider.setAttribute('pointer-events','none');
  wg.appendChild(divider);
}

function mkPath(d, fill, stroke, sw) {
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('fill',fill);
  p.setAttribute('stroke',stroke); p.setAttribute('stroke-width',sw);
  return p;
}
function mkText(str, x, y, size, fill) {
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle');
  t.setAttribute('font-size',size); t.setAttribute('font-weight','bold');
  t.setAttribute('fill',fill); t.setAttribute('font-family','Georgia,serif');
  t.textContent = str;
  return t;
}

// ── CLOCK (music indicator only — no real time) ───────────────
function drawHourDigits() {
  const g = document.getElementById('hour-digits');
  g.innerHTML = '';
  for (let h=1; h<=12; h++) {
    const label = h===12 ? '0' : String(h);
    const [x,y] = polar(CX,CY,90, -90 + h*30);
    const t = mkText(label,x,y,9,'#c8960a');
    g.appendChild(t);
  }
}

function initHands() {
  // Park hand-1 (root) at 12 o'clock; hide others until notes played
  setHand('hand-1', -90, 70);
  hideHand('hand-2');
  hideHand('hand-3');
}



// ── AUDIO ────────────────────────────────────────────────────
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function noteFreq(note, oct=4) {
  const semi = {'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11};
  return 440 * Math.pow(2, (semi[note]-9 + (oct-4)*12)/12);
}

function stopAll() {
  const ctx = getCtx();
  activeOscs.forEach(({osc,gain}) => {
    try {
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime+0.1);
      osc.stop(ctx.currentTime+0.12);
    } catch(e){}
  });
  activeOscs = [];
}

// Different timbres per instrument
function playTone(freq, oct) {
  const ctx = getCtx();
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();

  if (instrument === 'piano') {
    osc.type = 'triangle';
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    // Add slight harmonics with a second osc
    const osc2 = ctx.createOscillator();
    const g2   = ctx.createGain();
    osc2.type = 'sine'; osc2.frequency.value = freq * 2;
    g2.gain.setValueAtTime(0.06, ctx.currentTime);
    osc2.connect(g2); g2.connect(ctx.destination);
    osc2.start(); activeOscs.push({osc:osc2,gain:g2});
  } else if (instrument === 'sax') {
    osc.type = 'sawtooth';
    // Filter for warmth
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1200; filter.Q.value = 3;
    osc.connect(filter); filter.connect(gain);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.start();
    activeOscs.push({osc,gain});
    return; // already connected
  } else if (instrument === 'guitar') {
    // Karplus-Strong approximation via square + short decay
    osc.type = 'square';
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
  }

  osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start();
  activeOscs.push({osc,gain});
}

function getChordNotes(root, type) {
  const ri = ALL_CHROMATIC.indexOf(root);
  const intervals = type==='major'?[0,4,7]:type==='minor'?[0,3,7]:[0,4,7,10];
  return intervals.map(i => ALL_CHROMATIC[(ri+i)%12]);
}

function playNoteOrChord(note, oct=4) {
  stopAll();
  if (chordMode) {
    getChordNotes(note,chordType).forEach((n,i) => {
      setTimeout(()=>playTone(noteFreq(n,oct),oct), i*30);
    });
    updateChordLabel(note + ' ' + chordType[0].toUpperCase()+chordType.slice(1));
  } else {
    playTone(noteFreq(note,oct), oct);
    updateChordLabel(note);
  }
}

// ── KEY LISTENERS ─────────────────────────────────────────────
function addKeyListeners() {
  document.querySelectorAll('.piano-key,.key-half,.key-label,.black-key').forEach(el => {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      const note = el.dataset.note; if (!note) return;
      prevNote = activeNote;
      activeNote = note;
      const oct = el.dataset.octave === 'lower' ? 3 : 4;
      playNoteOrChord(note, oct);
      highlightKeyHalves(note, el.dataset.octave === 'lower' ? 'inner' : 'outer');
      updateHands(note);
      drawPiano();
    });
    el.addEventListener('pointerup',    () => { stopAll(); clearKeyHighlight(); });
    el.addEventListener('pointerleave', () => { stopAll(); clearKeyHighlight(); });
  });
}

// Flash the pressed half dark purple, other half soft purple
function highlightKeyHalves(note, pressedHalf) {
  // Color the background wedge with a base purple
  document.querySelectorAll('.white-key,.black-key').forEach(el => {
    if (el.dataset.note === note) {
      el.setAttribute('fill', '#6633bb');
    }
  });
  // Overlay each half zone with its specific shade
  document.querySelectorAll('.key-half').forEach(el => {
    if (el.dataset.note !== note) return;
    const isInner = el.classList.contains('piano-key-inner');
    const isOuter = el.classList.contains('piano-key-outer');
    const isPressed = (isInner && pressedHalf === 'inner') || (isOuter && pressedHalf === 'outer');
    // Make the half visible with a solid color
    el.setAttribute('fill', isPressed ? '#2a0a66' : '#aa77ee');
    el.setAttribute('fill-opacity', '0.85');
  });
}

function clearKeyHighlight() {
  // Reset any half-zone overlays
  document.querySelectorAll('.key-half').forEach(el => {
    el.setAttribute('fill', 'transparent');
    el.setAttribute('fill-opacity', '1');
  });
  activeNote = null;
  drawPiano();
}

// ── HANDS ────────────────────────────────────────────────────
function setHand(id, deg, len) {
  const el = document.getElementById(id);
  if (!el) return;
  const [x2,y2] = polar(CX,CY,len,deg);
  el.setAttribute('x2',x2); el.setAttribute('y2',y2);
  el.style.display = '';
}

function hideHand(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}

function noteToAngle(note) {
  // Map any chromatic note to a clock angle
  // White notes → their wedge center; black notes → midpoint between neighbors
  const wIdx = WHITE_NOTES.indexOf(note);
  if (wIdx >= 0) return whiteKeyCenter(wIdx);
  // Black note: find position between adjacent white keys
  const blackAngles = {
    'D#': whiteKeyCenter(0) + WHITE_DEG/2, // between D and E
    'F#': whiteKeyCenter(2) + WHITE_DEG/2, // between F and G
    'G#': whiteKeyCenter(3) + WHITE_DEG/2, // between G and A
    'A#': whiteKeyCenter(4) + WHITE_DEG/2, // between A and B
    'C#': whiteKeyCenter(6) + WHITE_DEG/2, // between C and D (wraps)
  };
  return blackAngles[note] ?? whiteKeyCenter(0);
}

function updateHands(note) {
  if (chordMode) {
    // All 3 hands point to the 3 chord notes
    const chordNotes = getChordNotes(note, chordType);
    setHand('hand-1', noteToAngle(chordNotes[0]), 70);  // root — gold
    setHand('hand-2', noteToAngle(chordNotes[1]), 88);  // third — blue
    setHand('hand-3', noteToAngle(chordNotes[2]), 98);  // fifth — red
  } else {
    // Single note mode: hand-1 → current, hand-2 → previous, hand-3 hidden
    setHand('hand-1', noteToAngle(note), 70);
    if (prevNote) setHand('hand-2', noteToAngle(prevNote), 88);
    hideHand('hand-3');
  }
}

// ── CHORD LABEL ──────────────────────────────────────────────
function updateChordLabel(txt) {
  document.getElementById('chord-label').textContent = txt;
  document.getElementById('chord-input').value = txt;
}

document.getElementById('chord-label').addEventListener('click',()=>{
  document.getElementById('chord-label').style.display='none';
  const i=document.getElementById('chord-input');
  i.style.display='block'; i.focus();
});
document.getElementById('chord-input').addEventListener('blur',()=>{
  const v=document.getElementById('chord-input').value;
  document.getElementById('chord-label').textContent=v;
  document.getElementById('chord-label').style.display='';
  document.getElementById('chord-input').style.display='none';
});
document.getElementById('chord-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('chord-input').blur();
});

// ── CHORD TOGGLE ─────────────────────────────────────────────
document.getElementById('chord-toggle').addEventListener('click',()=>{
  chordMode=!chordMode;
  document.getElementById('chord-toggle').classList.toggle('on',chordMode);
});

// ── CHORD TYPE ───────────────────────────────────────────────
['minor','seventh','major'].forEach(t=>{
  document.getElementById('btn-'+t).addEventListener('click',function(){
    chordType=t;
    document.querySelectorAll('.chord-type-btn').forEach(b=>b.classList.remove('selected'));
    this.classList.add('selected');
  });
});

// ── SETTINGS ────────────────────────────────────────────────
document.getElementById('btn-settings').addEventListener('click',()=>{
  document.getElementById('settings-page').classList.add('visible');
  initMidi();
});
document.getElementById('close-settings').addEventListener('click',()=>{
  document.getElementById('settings-page').classList.remove('visible');
  drawPiano();
});

// ── INSTRUMENT ───────────────────────────────────────────────
document.querySelectorAll('input[name=instrument]').forEach(r=>{
  r.addEventListener('change',function(){ instrument=this.value; });
});

// ── SCALE KEYBOARD ───────────────────────────────────────────
document.querySelectorAll('.sk-white,.sk-black').forEach(k=>{
  k.addEventListener('click',function(){
    scaleKey=this.dataset.note;
    document.querySelectorAll('.sk-white,.sk-black').forEach(x=>x.classList.remove('scale-active'));
    this.classList.add('scale-active');
    drawPiano();
  });
});
document.getElementById('scale-type').addEventListener('change',function(){
  scaleType=this.value; drawPiano();
});

// ── STRUM SPEED ──────────────────────────────────────────────
document.getElementById('strum-speed').addEventListener('input',function(){
  document.getElementById('strum-val').textContent=this.value;
});

// ── METRONOME ────────────────────────────────────────────────
document.getElementById('btn-metro').addEventListener('click',function(){
  metroOn=!metroOn;
  this.classList.toggle('active-on',metroOn);
  metroOn ? startMetro() : stopMetro();
});
function startMetro(){
  const bpm=parseInt(document.getElementById('metro-bpm').value)||110;
  metroTimer=setInterval(metroBeat, 60000/bpm);
}
function stopMetro(){ clearInterval(metroTimer); }
function metroBeat(){
  const ctx=getCtx();
  const sound=document.querySelector('input[name=metro-sound]:checked')?.value||'tick';
  const osc=ctx.createOscillator(), g=ctx.createGain();
  if (sound==='beep')       { osc.frequency.value=880; }
  else if (sound==='drum')  { osc.frequency.value=100; osc.type='sawtooth'; }
  else                      { osc.frequency.value=1400; } // tick
  g.gain.setValueAtTime(0.2,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.04);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+0.05);
}

// ── MIDI ─────────────────────────────────────────────────────
async function initMidi(){
  const dot=document.getElementById('midi-dot');
  const st=document.getElementById('midi-status');
  if(!navigator.requestMIDIAccess){
    dot.style.cssText='background:#cc2222;box-shadow:0 0 6px #cc2222';
    st.textContent='Web MIDI not supported'; return;
  }
  try {
    const access=await navigator.requestMIDIAccess();
    const outs=[...access.outputs.values()];
    if(outs.length){
      midiOutput=outs[0];
      dot.style.cssText='background:#22cc55;box-shadow:0 0 6px #22cc55';
      st.textContent='Connected: '+(midiOutput.name||'MIDI Device');
    } else {
      dot.style.cssText='background:#f0c030;box-shadow:0 0 6px #f0c030';
      st.textContent='No MIDI outputs found';
    }
  } catch(e){
    dot.style.cssText='background:#f0c030;box-shadow:0 0 6px #f0c030';
    st.textContent='Permission denied — check browser prompt';
  }
}

// ── INIT ─────────────────────────────────────────────────────
drawHourDigits();
drawPiano();
initHands();
</script>
